<text x="631" y="364" font-family="Arial, sans-serif" font-size="10" fill="#475569">orchestrate</text>
<path d="M 820 370 L 845 370 L 845 478 L 870 478" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="851" y="472" font-family="Arial, sans-serif" font-size="10" fill="#475569">tools</text>
<path d="M 1040 478 L 1065 478 L 1065 586 L 1090 586" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="1071" y="580" font-family="Arial, sans-serif" font-size="10" fill="#475569">metadata</text>
<path d="M 1090 602 L 1065 602 L 1065 278 L 820 278" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="1071" y="272" font-family="Arial, sans-serif" font-size="10" fill="#475569">results</text>
<path d="M 650 246 L 625 246 L 625 154 L 600 154" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="631" y="148" font-family="Arial, sans-serif" font-size="10" fill="#475569">review</text>
<path d="M 600 154 L 625 154 L 625 686 L 650 686" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="631" y="680" font-family="Arial, sans-serif" font-size="10" fill="#475569">approval</text>
<path d="M 820 694 L 910 694" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="916" y="688" font-family="Arial, sans-serif" font-size="10" fill="#475569">approved</text>
<path d="M 1080 694 L 1085 694 L 1085 262 L 1090 262" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="1091" y="256" font-family="Arial, sans-serif" font-size="10" fill="#475569">status</text>
