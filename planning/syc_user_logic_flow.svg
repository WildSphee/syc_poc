<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
<rect width="100%" height="100%" fill="#F8FAFC"/>
<text x="40" y="44" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0F172A">User Logic Flow</text>
<text x="40" y="70" font-family="Arial, sans-serif" font-size="13" fill="#475569">Officer-facing flow from login to case creation and D365 status confirmation</text>
<rect x="70" y="130" width="190" height="96" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="84" y="154" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Sign In</text>
<text x="84" y="180" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#475569">User authenticates through</text>
<text x="84" y="195" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#475569">Entra ID and lands in the</text>
<text x="84" y="210" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#475569">SYC portal.</text>
<rect x="320" y="130" width="190" height="96" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="334" y="154" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Choose Action</text>
<text x="334" y="180" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#475569">Create new case or search</text>
<text x="334" y="195" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#475569">an existing case based on</text>
<text x="334" y="210" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#475569">RBAC.</text>
<rect x="570" y="130" width="190" height="96" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="584" y="154" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Enter Case Data</text>
<text x="584" y="180" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#475569">Complete intake fields with</text>
<text x="584" y="195" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#475569">validation and autosave.</text>
<rect x="820" y="130" width="190" height="96" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="834" y="154" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Upload Documents</text>
<text x="834" y="180" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#475569">Upload supporting documents</text>
<text x="834" y="195" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#475569">and receive processing</text>
<text x="834" y="210" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#475569">status.</text>
<rect x="820" y="310" width="190" height="96" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="834" y="334" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Review AI Output</text>
<text x="834" y="360" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#475569">Check extracted values,</text>
<text x="834" y="375" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#475569">exceptions, confidence, and</text>
<text x="834" y="390" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#475569">suggested actions.</text>
<rect x="570" y="310" width="190" height="96" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="584" y="334" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Correct and Confirm</text>
<text x="584" y="360" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#475569">Edit values, resolve flags,</text>
<text x="584" y="375" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#475569">and explicitly confirm next</text>
<text x="584" y="390" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#475569">action.</text>
<rect x="320" y="310" width="190" height="96" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="334" y="334" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Submit Approval</text>
<text x="334" y="360" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#475569">Route case to configured</text>
<text x="334" y="375" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#475569">approver group with</text>
<text x="334" y="390" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#475569">comments.</text>
<rect x="70" y="310" width="190" height="96" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="84" y="334" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Approval Decision</text>
<text x="84" y="360" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#475569">Approver approves or</text>
<text x="84" y="375" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#475569">rejects with reason and</text>
<text x="84" y="390" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#475569">timestamp.</text>
<rect x="70" y="500" width="190" height="96" rx="8" fill="#FEF2F2" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="84" y="524" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Rejected</text>
<text x="84" y="550" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#475569">Case returns to officer for</text>
<text x="84" y="565" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#475569">correction or closure.</text>
<rect x="320" y="500" width="190" height="96" rx="8" fill="#ECFDF5" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="334" y="524" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Approved</text>
<text x="334" y="550" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#475569">Backend locks approved</text>
<text x="334" y="565" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#475569">payload for write-back.</text>
<rect x="570" y="500" width="190" height="96" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="584" y="524" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Create D365 Case</text>
<text x="584" y="550" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#475569">System inserts approved</text>
<text x="584" y="565" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#475569">case into D365 on-prem.</text>
<rect x="820" y="500" width="190" height="96" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="834" y="524" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Track Outcome</text>
<text x="834" y="550" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#475569">Portal shows D365</text>
<text x="834" y="565" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#475569">reference, failure reason,</text>
<text x="834" y="580" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#475569">and audit events.</text>
<line x1="260" y1="178" x2="320" y2="178" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="510" y1="178" x2="570" y2="178" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="760" y1="178" x2="820" y2="178" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="915" y1="226" x2="915" y2="310" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="921.0" y="262.0" font-family="Arial, sans-serif" font-size="10" fill="#475569">processed</text>
<line x1="820" y1="358" x2="760" y2="358" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="570" y1="358" x2="510" y2="358" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="320" y1="358" x2="260" y2="358" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="165" y1="406" x2="165" y2="500" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="171.0" y="447.0" font-family="Arial, sans-serif" font-size="10" fill="#475569">reject</text>
<line x1="510" y1="548" x2="570" y2="548" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="760" y1="548" x2="820" y2="548" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 260 358 L 290 358 L 290 548 L 320 548" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="296" y="542" font-family="Arial, sans-serif" font-size="10" fill="#475569">approve</text>
<path d="M 70 548 L 40 548 L 40 96 L 665 96 L 665 130" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="46" y="90" font-family="Arial, sans-serif" font-size="10" fill="#475569">resubmit after correction</text>
</svg>
